name: Python 项目 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ========== 第一阶段：代码检查 ==========
  
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 uv
        uses: astral-sh/setup-uv@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: 安装依赖（含开发依赖）
        run: uv sync --frozen

      - name: 运行 Ruff（代码检查）
        run: uv run ruff check .

      - name: 运行 mypy（类型检查）
        run: uv run mypy . || echo "⚠️ 类型检查有警告"

  # ========== 第二阶段：单元测试 ==========
  
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 可以在多个 Python 版本上测试
        python-version: ['3.12']
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 uv
        uses: astral-sh/setup-uv@v6
      
      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'uv'

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest --cov=app --cov-report=xml --cov-report=html -v
      
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      
      - name: 上传 HTML 覆盖率报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  # ========== 第三阶段：构建 Docker 镜像 ==========
  
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-flask-app:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-flask-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-flask-app:buildcache,mode=max

  # ========== 第四阶段：部署（Render，代替自建服务器）==========
  # Render 会读取仓库根目录的 render.yaml（Blueprint）创建服务，
  # 并用仓库里的 Dockerfile 构建镜像，不需要我们提供任何服务器。
  # 本阶段向 Render 的 Deploy Hook 发一个请求，触发一次构建+部署。
  
  deploy:
    name: 部署到 Render
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      # 首次部署后如果实际地址不是这个，改成 Render 控制台里的地址即可
      url: https://my-flask-app-iy7n.onrender.com
    
    steps:
      - name: 触发 Render 部署
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail "$RENDER_DEPLOY_HOOK_URL"
      
      - name: 提示查看部署进度
        run: |
          echo "已触发 Render 部署，请到 Render Dashboard 查看 Events 和日志："
          echo "https://dashboard.render.com"
          echo "部署完成后访问：https://my-flask-app.onrender.com/health"
